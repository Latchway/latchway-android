name: Android SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Android SDK
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Android platform and build tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Run unit, assembly, and lint gates
        run: ./gradlew test assemble lint --no-daemon
      - name: Publish and compile an independent offline consumer
        run: ./scripts/verify-local-publication.sh
      - name: Retain the verified test Maven repository
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latchway-android-test-maven-repository
          path: build/publication-test-repository
          if-no-files-found: error
          retention-days: 7
