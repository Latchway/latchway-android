name: Android SDK release

on:
  repository_dispatch:
    types: [latchway_release_promoted]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.client_payload.repository.commit }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify core promotion and create SDK tag
    if: github.repository == 'Latchway/latchway-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: write
    outputs:
      commit: ${{ steps.promotion.outputs.release_commit }}
      tag: ${{ steps.promotion.outputs.release_tag }}
      version: ${{ steps.promotion.outputs.release_version }}
      core_tag: ${{ steps.promotion.outputs.core_tag }}
      report_sha256: ${{ steps.promotion.outputs.report_sha256 }}
    steps:
      - name: Check out exact promoted Android source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.client_payload.repository.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate dispatch envelope before network access
        shell: bash
        env:
          SDK_ID: ${{ github.event.client_payload.repository.id }}
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          set -euo pipefail
          test "$SDK_ID" = android
          [[ "$SDK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SDK_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$SDK_TAG" = "v$SDK_VERSION"
          [[ "$CORE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "$REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OCI_IMAGE_DIGEST" =~ ^ghcr\.io/latchway/latchway@sha256:[0-9a-f]{64}$ ]]
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          test "$GITHUB_SHA" = "$SDK_COMMIT"
          test "$(git rev-parse --verify HEAD)" = "$SDK_COMMIT"
      - name: Download and hash the exact core promotion report
        shell: bash
        env:
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          CORE_READ_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/latchway-cross-repository-promotion.json"
          auth_config="$RUNNER_TEMP/latchway-core-release-auth"
          trap 'rm -f -- "$auth_config"' EXIT
          test "$REPORT_URL" = "https://github.com/Latchway/latchway/releases/download/$CORE_TAG/latchway-cross-repository-promotion.json"
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$CORE_READ_TOKEN" > "$auth_config"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --config "$auth_config" \
            --connect-timeout 15 --max-time 120 --max-filesize 2097152 \
            --fail --location --silent --show-error --output "$report" "$REPORT_URL"
          rm -f -- "$auth_config"
          trap - EXIT
          printf '%s  %s\n' "$REPORT_SHA256" "$report" | sha256sum --check --strict
      - name: Verify the core workflow artifact attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_SIBLING_REPOSITORIES_READ_TOKEN || github.token }}
        run: |
          python3 scripts/require-gh-version.py
          gh attestation verify "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --repo Latchway/latchway \
            --signer-workflow Latchway/latchway/.github/workflows/cross-repository-conformance.yml \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
      - name: Validate exact report, dispatch, and local source bindings
        id: promotion
        shell: bash
        env:
          SDK_COMMIT: ${{ github.event.client_payload.repository.commit }}
          SDK_VERSION: ${{ github.event.client_payload.repository.version }}
          SDK_TAG: ${{ github.event.client_payload.repository.intended_tag }}
          CORE_TAG: ${{ github.event.client_payload.core_tag }}
          REPORT_URL: ${{ github.event.client_payload.promotion_evidence_url }}
          REPORT_SHA256: ${{ github.event.client_payload.promotion_evidence_sha256 }}
          OCI_IMAGE_DIGEST: ${{ github.event.client_payload.oci_image_digest }}
        run: |
          python3 scripts/verify-release-promotion.py \
            --report "$RUNNER_TEMP/latchway-cross-repository-promotion.json" \
            --report-url "$REPORT_URL" \
            --report-sha256 "$REPORT_SHA256" \
            --repository-id android \
            --repository-commit "$SDK_COMMIT" \
            --repository-version "$SDK_VERSION" \
            --repository-tag "$SDK_TAG" \
            --workflow-commit "$GITHUB_SHA" \
            --core-tag "$CORE_TAG" \
            --oci-image-digest "$OCI_IMAGE_DIGEST" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create or verify evidence-gated annotated SDK tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.promotion.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.promotion.outputs.release_tag }}
          CORE_TAG: ${{ steps.promotion.outputs.core_tag }}
          REPORT_SHA256: ${{ steps.promotion.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          message="Android SDK $RELEASE_TAG

          Core promotion: $CORE_TAG
          Promotion evidence SHA-256: $REPORT_SHA256"
          remote=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$remote" ]]; then
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.type)" = commit
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .object.sha)" = "$RELEASE_COMMIT"
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq .message)" = "$message"
          else
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" \
              --arg object "$RELEASE_COMMIT" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: "github-actions[bot]", email: "41898282+github-actions[bot]@users.noreply.github.com", date: $date}}' \
              > "$RUNNER_TEMP/sdk-tag-object.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" --input "$RUNNER_TEMP/sdk-tag-object.json" > "$RUNNER_TEMP/sdk-tag-result.json"
            tag_object=$(jq --raw-output .sha "$RUNNER_TEMP/sdk-tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref: $ref, sha: $sha}' > "$RUNNER_TEMP/sdk-tag-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input "$RUNNER_TEMP/sdk-tag-ref.json" >/dev/null
          fi
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"

  publish:
    if: github.repository == 'Latchway/latchway-android'
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: maven-central
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_COMMIT: ${{ needs.promote.outputs.commit }}
      RELEASE_TAG: ${{ needs.promote.outputs.tag }}
      CORE_TAG: ${{ needs.promote.outputs.core_tag }}
      REPORT_SHA256: ${{ needs.promote.outputs.report_sha256 }}
      LATCHWAY_CENTRAL_SIGNING_FINGERPRINT: ${{ vars.LATCHWAY_MAVEN_SIGNING_FINGERPRINT }}
    steps:
      - name: Check out exact promoted Android source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.promote.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and validate the promoted annotated tag
        run: |
          set -euo pipefail
          printf 'Android SDK %s\n\nCore promotion: %s\nPromotion evidence SHA-256: %s' \
            "$RELEASE_TAG" "$CORE_TAG" "$REPORT_SHA256" > "$RUNNER_TEMP/sdk-tag-message.txt"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          scripts/release-preflight.sh "$RELEASE_TAG"
      - name: Require protected immutable-release administration policy
        env:
          GH_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 scripts/require-gh-version.py
          gh release verify --help >/dev/null
          gh release verify-asset --help >/dev/null
          enabled=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)
          test "$enabled" = true
      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923" # 20.0
          packages: ""
      - name: Install the pinned Android platform and build tools
        run: scripts/install-android-sdk.sh
      - name: Run the complete Android SDK gate
        run: |
          export LATCHWAY_VERSION="${RELEASE_TAG#v}"
          ./gradlew test assemble lint --no-daemon
      - name: Build and verify the reproducible Maven bundle
        run: |
          export LATCHWAY_VERSION="${RELEASE_TAG#v}"
          scripts/build-release-artifacts.sh "$LATCHWAY_VERSION"
      - name: Export the reviewed public half of the Maven signing key
        shell: bash
        env:
          LATCHWAY_SIGNING_KEY: ${{ secrets.LATCHWAY_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          [[ "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]
          signing_key=$LATCHWAY_SIGNING_KEY
          unset LATCHWAY_SIGNING_KEY
          keyring=$(mktemp -d "$RUNNER_TEMP/latchway-release-public-key.XXXXXX")
          chmod 700 "$keyring"
          printf '%s' "$signing_key" | gpg --batch --homedir "$keyring" --import >/dev/null 2>&1
          unset signing_key
          observed=$(gpg --batch --homedir "$keyring" --with-colons --fingerprint \
            "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$observed" = "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT"
          gpg --batch --homedir "$keyring" --armor --export-options export-minimal \
            --export "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" \
            > build/release/latchway-maven-signing-public-key.asc
          test -s build/release/latchway-maven-signing-public-key.asc
      - name: Build the pre-reviewed signed Central Portal bundle
        shell: bash
        env:
          LATCHWAY_SIGNING_KEY: ${{ secrets.LATCHWAY_SIGNING_KEY }}
          LATCHWAY_SIGNING_PASSWORD: ${{ secrets.LATCHWAY_SIGNING_PASSWORD }}
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ github.workspace }}/build/release/latchway-maven-signing-public-key.asc
        run: |
          scripts/build-central-portal-bundle.sh \
            "${RELEASE_TAG#v}" \
            "build/release/latchway-android-${RELEASE_TAG#v}-central-portal.zip"
      - name: Attest the exact release bundle
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            build/release/latchway-android-*-maven-repository.zip
            build/release/latchway-android-*-central-portal.zip
            build/release/latchway-maven-signing-public-key.asc
      - name: Create the single-use Maven Central upload intent
        env:
          LATCHWAY_RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          python3 scripts/central-deployment-record.py create-intent \
            --repository build/release/repository \
            --archive "build/release/latchway-android-$LATCHWAY_RELEASE_VERSION-maven-repository.zip" \
            --portal-bundle "build/release/latchway-android-$LATCHWAY_RELEASE_VERSION-central-portal.zip" \
            --public-key build/release/latchway-maven-signing-public-key.asc \
            --source-commit "$RELEASE_COMMIT" \
            --tag "$RELEASE_TAG" \
            --version "$LATCHWAY_RELEASE_VERSION" \
            --namespace dev.latchway \
            --publishing-type user_managed \
            --output build/release/maven-central-upload-intent.json
      - name: Attest the exact upload intent
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: build/release/maven-central-upload-intent.json
      - name: Create or resume the fixed-asset GitHub draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          python3 scripts/reconcile-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-tag-message-file "$RUNNER_TEMP/sdk-tag-message.txt" \
            --tag-binding-output build/release/github-release-tag-binding.json \
            --draft-only \
            --guard-asset maven-central-upload-intent.json \
            --github-output "$GITHUB_OUTPUT" \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            --allowed-asset-name SHA256SUMS \
            --allowed-asset-name github-release-tag-binding.json \
            --allowed-asset-name latchway-maven-signing-public-key.asc \
            --allowed-asset-name maven-central-upload-intent.json \
            --allowed-asset-name maven-central-deployment.json \
            --allowed-asset-name maven-central-deployment-status.json \
            --allowed-asset-name maven-central-release-evidence.json \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            build/release/latchway-maven-signing-public-key.asc \
            build/release/maven-central-upload-intent.json
      - name: Durably attach the exact promoted tag binding before Portal access
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          python3 scripts/reconcile-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-tag-message-file "$RUNNER_TEMP/sdk-tag-message.txt" \
            --tag-binding-output build/release/github-release-tag-binding.json \
            --draft-only \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            --allowed-asset-name SHA256SUMS \
            --allowed-asset-name github-release-tag-binding.json \
            --allowed-asset-name latchway-maven-signing-public-key.asc \
            --allowed-asset-name maven-central-upload-intent.json \
            --allowed-asset-name maven-central-deployment.json \
            --allowed-asset-name maven-central-deployment-status.json \
            --allowed-asset-name maven-central-release-evidence.json \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            build/release/github-release-tag-binding.json \
            build/release/latchway-maven-signing-public-key.asc \
            build/release/maven-central-upload-intent.json
      - name: Restore an exact deployment record from the draft when present
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          for name in maven-central-deployment.json maven-central-deployment-status.json; do
            count=$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release")
            test "$count" -le 1
            if test "$count" = 1; then
              asset_id=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' <<<"$release")
              gh api --method GET -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
                > "build/release/$name"
            fi
          done
          if test -f build/release/maven-central-deployment.json; then
            echo "record_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "record_present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload once or resume the exact Portal deployment
        env:
          LATCHWAY_RELEASE_VERSION: ${{ needs.promote.outputs.version }}
          LATCHWAY_CENTRAL_PUBLISHING_TYPE: user_managed
          LATCHWAY_CENTRAL_UPLOAD_INTENT: ${{ github.workspace }}/build/release/maven-central-upload-intent.json
          LATCHWAY_CENTRAL_DEPLOYMENT_RECORD: ${{ github.workspace }}/build/release/maven-central-deployment.json
          LATCHWAY_CENTRAL_DEPLOYMENT_STATUS: ${{ github.workspace }}/build/release/maven-central-deployment-status.json
          LATCHWAY_CENTRAL_INTENT_FRESH: ${{ steps.draft.outputs.guard_uploaded }}
          LATCHWAY_CENTRAL_STOP_AFTER_RECORD: "true"
          LATCHWAY_CENTRAL_SKIP_LOCAL_GATES: "true"
          LATCHWAY_MAVEN_CENTRAL_USERNAME: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_USERNAME }}
          LATCHWAY_MAVEN_CENTRAL_PASSWORD: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_PASSWORD }}
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ github.workspace }}/build/release/latchway-maven-signing-public-key.asc
          LATCHWAY_CENTRAL_PORTAL_BUNDLE: ${{ github.workspace }}/build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip
        run: scripts/publish-central.sh
      - name: Durably attach the exact Portal deployment ID before waiting
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          python3 scripts/reconcile-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-tag-message-file "$RUNNER_TEMP/sdk-tag-message.txt" \
            --tag-binding-output build/release/github-release-tag-binding.json \
            --draft-only \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            --allowed-asset-name "latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            --allowed-asset-name SHA256SUMS \
            --allowed-asset-name github-release-tag-binding.json \
            --allowed-asset-name latchway-maven-signing-public-key.asc \
            --allowed-asset-name maven-central-upload-intent.json \
            --allowed-asset-name maven-central-deployment.json \
            --allowed-asset-name maven-central-deployment-status.json \
            --allowed-asset-name maven-central-release-evidence.json \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            build/release/github-release-tag-binding.json \
            build/release/latchway-maven-signing-public-key.asc \
            build/release/maven-central-upload-intent.json \
            build/release/maven-central-deployment.json
      - name: Wait on only the recorded Portal deployment
        env:
          LATCHWAY_RELEASE_VERSION: ${{ needs.promote.outputs.version }}
          LATCHWAY_CENTRAL_PUBLISHING_TYPE: user_managed
          LATCHWAY_CENTRAL_UPLOAD_INTENT: ${{ github.workspace }}/build/release/maven-central-upload-intent.json
          LATCHWAY_CENTRAL_DEPLOYMENT_RECORD: ${{ github.workspace }}/build/release/maven-central-deployment.json
          LATCHWAY_CENTRAL_DEPLOYMENT_STATUS: ${{ github.workspace }}/build/release/maven-central-deployment-status.json
          LATCHWAY_CENTRAL_INTENT_FRESH: "false"
          LATCHWAY_CENTRAL_STOP_AFTER_RECORD: "false"
          LATCHWAY_CENTRAL_PUBLISH_AFTER_VALIDATION: "true"
          LATCHWAY_MAVEN_CENTRAL_USERNAME: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_USERNAME }}
          LATCHWAY_MAVEN_CENTRAL_PASSWORD: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_PASSWORD }}
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ github.workspace }}/build/release/latchway-maven-signing-public-key.asc
          LATCHWAY_CENTRAL_PORTAL_BUNDLE: ${{ github.workspace }}/build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip
        run: scripts/publish-central.sh
      - name: Verify the immutable public artifacts
        env:
          LATCHWAY_CENTRAL_EXPECTED_REPOSITORY: ${{ github.workspace }}/build/release/repository
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ github.workspace }}/build/release/latchway-maven-signing-public-key.asc
          LATCHWAY_CENTRAL_UPLOAD_INTENT: ${{ github.workspace }}/build/release/maven-central-upload-intent.json
          LATCHWAY_CENTRAL_DEPLOYMENT_RECORD: ${{ github.workspace }}/build/release/maven-central-deployment.json
          LATCHWAY_CENTRAL_DEPLOYMENT_STATUS: ${{ github.workspace }}/build/release/maven-central-deployment-status.json
          LATCHWAY_CENTRAL_REQUIRE_DEPLOYMENT_EVIDENCE: "true"
          LATCHWAY_RELEASE_VERSION: ${{ needs.promote.outputs.version }}
        run: |
          scripts/verify-central-release.sh "$LATCHWAY_RELEASE_VERSION" \
            > build/release/maven-central-release-evidence.json
      - name: Seal the complete fixed-asset checksum manifest
        working-directory: build/release
        run: |
          set -euo pipefail
          sha256sum \
            "latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            "latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            github-release-tag-binding.json \
            latchway-maven-signing-public-key.asc \
            maven-central-upload-intent.json \
            maven-central-deployment.json \
            maven-central-deployment-status.json \
            maven-central-release-evidence.json \
            > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest the exact post-Central evidence
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            build/release/maven-central-deployment.json
            build/release/maven-central-deployment-status.json
            build/release/maven-central-release-evidence.json
            build/release/github-release-tag-binding.json
            build/release/SHA256SUMS
      - name: Attach every fixed asset, publish, and require immutability
        env:
          GH_TOKEN: ${{ github.token }}
          LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN: ${{ secrets.LATCHWAY_GITHUB_RELEASE_ADMIN_TOKEN }}
        run: |
          python3 scripts/reconcile-github-release.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --expected-commit "$RELEASE_COMMIT" \
            --expected-tag-message-file "$RUNNER_TEMP/sdk-tag-message.txt" \
            --tag-binding-output build/release/github-release-tag-binding.json \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip" \
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip" \
            build/release/SHA256SUMS \
            build/release/github-release-tag-binding.json \
            build/release/latchway-maven-signing-public-key.asc \
            build/release/maven-central-upload-intent.json \
            build/release/maven-central-deployment.json \
            build/release/maven-central-deployment-status.json \
            build/release/maven-central-release-evidence.json
      - name: Verify GitHub automatic release and per-asset attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attestation_dir="$RUNNER_TEMP/github-release-attestations"
          mkdir -p "$attestation_dir"
          verified=false
          for attempt in $(seq 1 12); do
            if gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json \
              > "$attestation_dir/release.json"; then
              verified=true
              break
            fi
            test "$attempt" = 12 || sleep 10
          done
          test "$verified" = true
          jq -e '(type == "object" and length > 0) or (type == "array" and length > 0)' \
            "$attestation_dir/release.json" >/dev/null

          assets=(
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-maven-repository.zip"
            "build/release/latchway-android-${{ needs.promote.outputs.version }}-central-portal.zip"
            build/release/SHA256SUMS
            build/release/github-release-tag-binding.json
            build/release/latchway-maven-signing-public-key.asc
            build/release/maven-central-upload-intent.json
            build/release/maven-central-deployment.json
            build/release/maven-central-deployment-status.json
            build/release/maven-central-release-evidence.json
          )
          for asset in "${assets[@]}"; do
            proof="$attestation_dir/$(basename "$asset").json"
            verified=false
            for attempt in $(seq 1 12); do
              if gh release verify-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" --format json > "$proof"; then
                verified=true
                break
              fi
              test "$attempt" = 12 || sleep 10
            done
            test "$verified" = true
            jq -e '(type == "object" and length > 0) or (type == "array" and length > 0)' "$proof" >/dev/null
          done
          python3 scripts/verify-github-release-attestation.py \
            --release-json "$attestation_dir/release.json" \
            --tag-binding build/release/github-release-tag-binding.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --tag-message-file "$RUNNER_TEMP/sdk-tag-message.txt" \
            > "$attestation_dir/release-commit-binding.json"
      - name: Retain exact GitHub release attestation verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-android-${{ needs.promote.outputs.version }}-github-release-attestations
          path: ${{ runner.temp }}/github-release-attestations
          if-no-files-found: error
          retention-days: 90
