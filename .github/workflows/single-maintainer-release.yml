name: Publish Android SDK v1.0.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-v1.0.0-publication
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0

jobs:
  package:
    name: Package and sign the Maven Central bundle
    if: github.repository == 'Latchway/latchway-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: single-maintainer-v1-signing
    permissions:
      contents: read
    steps:
      - name: Check out the tagged v1 source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: v1.0.0
          persist-credentials: false

      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923" # 20.0
          packages: ""

      - name: Install the Android packaging toolchain
        run: >-
          sdkmanager --channel=0
          'platforms;android-37.0'
          'build-tools;36.0.0'

      - name: Build and sign the Maven publication files
        env:
          LATCHWAY_SIGNING_KEY: ${{ secrets.LATCHWAY_SIGNING_KEY }}
          LATCHWAY_SIGNING_PASSWORD: ${{ secrets.LATCHWAY_SIGNING_PASSWORD }}
        run: >-
          ./gradlew
          --no-daemon
          --no-configuration-cache
          -Platchway.version=1.0.0
          -Platchway.central.enabled=false
          -Platchway.signing.enabled=true
          publishPublicArtifactsToPublicationTestRepository

      - name: Package the Central bundle
        run: |
          set -euo pipefail
          release_root="$RUNNER_TEMP/release"
          repository="$GITHUB_WORKSPACE/build/publication-test-repository"
          mkdir -p "$release_root"
          (
            cd "$repository"
            zip -q -r "$release_root/latchway-android-$RELEASE_VERSION-central-portal.zip" dev
          )

      - name: Transfer the publication bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-android-v1.0.0
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-maven-central:
    name: Publish v1.0.0 to Maven Central
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: single-maintainer-v1-maven
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download the signed publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-android-v1.0.0
          path: ${{ runner.temp }}/release

      - name: Upload and automatically publish the Central bundle
        env:
          LATCHWAY_MAVEN_CENTRAL_PASSWORD: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_PASSWORD }}
          LATCHWAY_MAVEN_CENTRAL_USERNAME: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_USERNAME }}
        run: |
          set -euo pipefail
          set +x
          umask 077
          auth_file="$RUNNER_TEMP/maven-central-auth"
          authorization=$(printf '%s:%s' \
            "$LATCHWAY_MAVEN_CENTRAL_USERNAME" \
            "$LATCHWAY_MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\r\n')
          printf 'Authorization: Bearer %s\n' "$authorization" > "$auth_file"
          unset authorization LATCHWAY_MAVEN_CENTRAL_USERNAME LATCHWAY_MAVEN_CENTRAL_PASSWORD
          trap 'rm -f -- "$auth_file"' EXIT HUP INT TERM
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 900 \
            --silent --show-error --fail --request POST \
            --header "@$auth_file" \
            --form "bundle=@$RUNNER_TEMP/release/latchway-android-$RELEASE_VERSION-central-portal.zip;type=application/octet-stream" \
            --output "$RUNNER_TEMP/maven-central-deployment-id.txt" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=latchway-android-$RELEASE_VERSION&publishingType=AUTOMATIC"

  github-release:
    name: Create the GitHub v1.0.0 release
    needs: [package, publish-maven-central]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the publication bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latchway-android-v1.0.0
          path: ${{ runner.temp }}/release

      - name: Create the GitHub v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            'Initial Latchway Android SDK v1.0.0 release.' \
            '' \
            'Published to Maven Central under the dev.latchway namespace.' \
            > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Latchway Android SDK v1.0.0' \
            --notes-file "$RUNNER_TEMP/release-notes.md"
