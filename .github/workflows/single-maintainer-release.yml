name: Single-maintainer Android v1 release

on:
  workflow_dispatch:
    inputs:
      release_profile:
        description: Explicit lower-assurance publication profile
        required: true
        type: choice
        options:
          - single_maintainer_v1
      release_commit:
        description: Exact 40-character main commit to publish
        required: true
        type: string
      release_version:
        description: Must be 1.0.0
        required: true
        default: 1.0.0
        type: string
      confirmation:
        description: Type publish-v1.0.0-with-deferred-assurance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-single-maintainer-v1-${{ inputs.release_commit }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: 1.0.0
  RELEASE_TAG: v1.0.0

jobs:
  intent:
    name: Bind explicit deferred-assurance intent to exact main source
    if: github.repository == 'Latchway/latchway-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      commit: ${{ steps.intent.outputs.commit }}
      core_commit: ${{ steps.intent.outputs.core_commit }}
      core_tag: ${{ steps.intent.outputs.core_tag }}
      intent_sha256: ${{ steps.intent.outputs.intent_sha256 }}
      tag: ${{ steps.intent.outputs.tag }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - name: Authenticate this exact main workflow run before candidate checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]{0,15}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,15}$ ]]
          (( GITHUB_RUN_ID <= 9007199254740991 ))
          (( GITHUB_RUN_ATTEMPT <= 9007199254740991 ))
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          jq --exit-status --arg commit "$RELEASE_COMMIT" --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" '
              .id == $run and .run_attempt == $attempt and .event == "workflow_dispatch" and
              .status == "in_progress" and .head_sha == $commit and .head_branch == "main" and
              .repository.full_name == "Latchway/latchway-android" and
              .head_repository.full_name == "Latchway/latchway-android" and
              (.workflow_id | type == "number" and . > 0)
            ' "$RUNNER_TEMP/run.json" >/dev/null
          workflow_id=$(jq --raw-output .workflow_id "$RUNNER_TEMP/run.json")
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id" > "$RUNNER_TEMP/workflow.json"
          jq --exit-status '.path == ".github/workflows/single-maintainer-release.yml" and .state == "active"' \
            "$RUNNER_TEMP/workflow.json" >/dev/null
      - name: Check out the exact requested source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify explicit single-maintainer request without credentials
        id: intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: >-
          python3 scripts/verify-maintainer-release.py
          --repository-name "$GITHUB_REPOSITORY"
          --profile "$RELEASE_PROFILE"
          --release-commit "$RELEASE_COMMIT"
          --release-version "$RELEASE_VERSION_INPUT"
          --workflow-commit "$GITHUB_SHA"
          --workflow-ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --confirmation "$CONFIRMATION"
          --intent-output "$RUNNER_TEMP/latchway-single-maintainer-v1-intent.json"
          --github-output "$GITHUB_OUTPUT"
      - name: Reject a v1 tag owned by another workflow transaction
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.intent.outputs.commit }}
          INTENT_SHA256: ${{ steps.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          message="Latchway Android SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-tag-ref.json" 2> "$RUNNER_TEMP/existing-tag-error"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/existing-tag-error"
            exit 0
          fi
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/existing-tag-ref.json")" = tag
          object=$(jq --exit-status --raw-output '.object.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/existing-tag-ref.json")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" > "$RUNNER_TEMP/existing-tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/existing-tag-object.json" >/dev/null
      - name: Bind intent artifact to this workflow attempt
        id: artifact
        run: printf 'name=android-maintainer-intent-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain exact lower-assurance publication intent
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/latchway-single-maintainer-v1-intent.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify:
    name: Run complete Android release gates before tag creation
    needs: intent
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: latchway
          POSTGRES_USER: latchway
          POSTGRES_PASSWORD: latchway-android-maintainer-release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latchway -d latchway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LATCHWAY_CONFORMANCE_DATABASE_URL: postgres://latchway:latchway-android-maintainer-release@127.0.0.1:5432/latchway?sslmode=disable
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Check out exact verified source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923" # 20.0
          packages: ""
      - name: Install the pinned Android platform and build tools
        run: scripts/install-android-sdk.sh
      - name: Run all offline release and evidence regression tests
        run: |
          set -euo pipefail
          python3 scripts/test-install-android-sdk.py
          python3 scripts/test-dependency-vulnerability-scan.py
          python3 scripts/test-device-evidence.py
          python3 scripts/test-physical-evidence-workflow.py
          python3 scripts/test-play-conformance-candidate.py
          python3 scripts/test-verify-gateway-deployment.py
          python3 scripts/run-offline-release-tests.py
          bash -n scripts/build-central-portal-bundle.sh scripts/publish-central.sh \
            scripts/publish-validated-central.sh scripts/verify-central-release.sh
      - name: Scan the exact dependency inventory
        env:
          LATCHWAY_OSV_EVIDENCE_PATH: ${{ runner.temp }}/android-dependency-vulnerability-scan.json
          SOURCE_COMMIT: ${{ needs.intent.outputs.commit }}
        run: scripts/scan-dependencies.sh "$SOURCE_COMMIT"
      - name: Test supported lower OkHttp and framework fixtures
        run: |
          set -euo pipefail
          ./gradlew :latchway-okhttp:testDebugUnitTest \
            -Platchway.okhttp.version=4.9.2 --no-daemon
          ./gradlew :latchway-okhttp:testDebugUnitTest \
            -Platchway.retrofit.version=2.11.0 \
            -Platchway.openaiKotlin.version=4.0.1 \
            --tests '*RetrofitFrameworkConformanceTest' \
            --tests '*OpenAiKotlinFrameworkConformanceTest' \
            --no-daemon
      - name: Run complete unit, assembly, and lint gates
        env:
          LATCHWAY_VERSION: ${{ needs.intent.outputs.version }}
        run: ./gradlew test assemble lint --no-daemon
      - name: Build and verify the reproducible unsigned Maven repository twice
        run: scripts/build-release-artifacts.sh "${{ needs.intent.outputs.version }}"
      - name: Build deterministic source-provenanced documentation bundle
        run: >-
          python3 scripts/build_docs_bundle.py
          --output-dir "$RUNNER_TEMP/android-docs-bundle"
          --version "${{ needs.intent.outputs.version }}"
          --commit "${{ needs.intent.outputs.commit }}"
          --require-clean
      - name: Download exact maintainer intent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.intent.outputs.artifact_name }}
          path: ${{ runner.temp }}/maintainer-intent
      - name: Stage the exact pre-tag release candidate
        env:
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/android-maintainer-candidate"
          mkdir -m 700 -p "$root/repository"
          cp -R build/release/repository/dev "$root/repository/dev"
          install -m 600 -- \
            "build/release/latchway-android-${{ needs.intent.outputs.version }}-maven-repository.zip" \
            build/release/SHA256SUMS \
            "$RUNNER_TEMP/android-dependency-vulnerability-scan.json" \
            "$RUNNER_TEMP/android-docs-bundle/docs-bundle-${{ needs.intent.outputs.version }}.tar.gz" \
            "$root/"
          intent="$RUNNER_TEMP/maintainer-intent/latchway-single-maintainer-v1-intent.json"
          printf '%s  %s\n' "$INTENT_SHA256" "$intent" | sha256sum --check --strict
          install -m 600 "$intent" "$root/"
      - name: Check out only the exact locked core revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ needs.intent.outputs.core_commit }}
          path: _core
          persist-credentials: false
      - name: Run pinned core Docker and PostgreSQL conformance
        env:
          LATCHWAY_SDK_KIND: android
          LATCHWAY_CORE_DIR: _core
          LATCHWAY_EVIDENCE_DIR: ${{ runner.temp }}/latchway-android-maintainer-core-conformance
          LATCHWAY_ANDROID_DEVELOP_CONFORMANCE: "1"
        run: >-
          sh scripts/run-pr-core-conformance.sh
          ./gradlew :latchway-okhttp:testDebugUnitTest
          --tests 'dev.latchway.okhttp.CoreDevelopLiveConformanceTest'
          --rerun-tasks --no-daemon
      - name: Include exact pinned-core conformance evidence
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/latchway-android-maintainer-core-conformance"
          test -d "$source" && test ! -L "$source"
          test -z "$(find "$source" -type l -print -quit)"
          python3 - "$source" "$RUNNER_TEMP/android-maintainer-candidate/pinned-core-conformance.tar.gz" <<'PY'
          import gzip, pathlib, stat, sys, tarfile
          source, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          paths = sorted(path for path in source.rglob("*") if path.is_file())
          if not paths:
              raise SystemExit("pinned-core conformance evidence is empty")
          with output.open("wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w") as archive:
                      for path in paths:
                          metadata = path.lstat()
                          if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                              raise SystemExit("unsafe pinned-core conformance evidence")
                          relative = path.relative_to(source).as_posix()
                          info = tarfile.TarInfo(f"pinned-core-conformance/{relative}")
                          info.size = metadata.st_size
                          info.mtime = 0
                          info.uid = info.gid = 0
                          info.uname = info.gname = ""
                          info.mode = 0o644
                          with path.open("rb") as payload:
                              archive.addfile(info, payload)
          PY
      - name: Bind verified candidate artifact to this attempt
        id: artifact
        run: printf 'name=android-maintainer-candidate-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer verified candidate to tag and isolated signing jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/android-maintainer-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  core-release-gate:
    name: Authenticate the exact public core v1 evidence before mutation
    needs: intent
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          persist-credentials: false
      - name: Verify registry-only public core record and supply chain with cloud deployments deferred
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-public-core-release.sh "${{ needs.intent.outputs.core_commit }}" "$RUNNER_TEMP/public-core-v1"

  tag:
    name: Create or adopt exact annotated deferred-assurance tag
    needs: [intent, verify, core-release-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: single-maintainer-v1-github
    permissions:
      contents: write
    outputs:
      tag_object_sha: ${{ steps.tag.outputs.tag_object_sha }}
    steps:
      - name: Verify exact lower-assurance GitHub environment
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-android:single-maintainer-v1-github"
      - name: Create or adopt only the exact annotated tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$INTENT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$RELEASE_COMMIT" = "$REQUESTED_COMMIT"
          test "$RELEASE_COMMIT" = "$WORKFLOW_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_COMMIT"
          message="Latchway Android SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json" 2> "$RUNNER_TEMP/ref.err"; then
            grep --fixed-strings --quiet 'HTTP 404' "$RUNNER_TEMP/ref.err"
            jq --null-input --arg tag "$RELEASE_TAG" --arg message "$message" --arg object "$RELEASE_COMMIT" \
              '{tag:$tag,message:$message,object:$object,type:"commit"}' > "$RUNNER_TEMP/tag.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              --input "$RUNNER_TEMP/tag.json" > "$RUNNER_TEMP/tag-result.json"
            tag_object=$(jq --raw-output '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/tag-result.json")
            jq --null-input --arg ref "refs/tags/$RELEASE_TAG" --arg sha "$tag_object" \
              '{ref:$ref,sha:$sha}' > "$RUNNER_TEMP/create-ref.json"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --input "$RUNNER_TEMP/create-ref.json" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/ref.json"
          fi
          tag_object=$(jq --raw-output '.object.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/ref.json")
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/ref.json")" = tag
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null
          printf 'tag_object_sha=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"

  sign:
    name: OpenPGP-sign the closed Maven set in an isolated environment
    needs: [intent, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: single-maintainer-v1-signing
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Verify exact lower-assurance signing environment
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-android:single-maintainer-v1-signing"
      - name: Check out exact signing helper source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          persist-credentials: false
      - name: Download exact unsigned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify.outputs.artifact_name }}
          path: ${{ runner.temp }}/android-maintainer-candidate
      - name: Sign exact primary artifacts and seal Portal upload intent
        env:
          LATCHWAY_CENTRAL_SIGNING_FINGERPRINT: ${{ vars.LATCHWAY_MAVEN_SIGNING_FINGERPRINT }}
          LATCHWAY_SIGNING_KEY: ${{ secrets.LATCHWAY_SIGNING_KEY }}
          LATCHWAY_SIGNING_PASSWORD: ${{ secrets.LATCHWAY_SIGNING_PASSWORD }}
        run: |
          set -Eeuo pipefail
          set +x
          umask 077
          [[ "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]
          test -n "$LATCHWAY_SIGNING_KEY"
          test -n "$LATCHWAY_SIGNING_PASSWORD"
          root="$RUNNER_TEMP/android-maintainer-candidate"
          repository="$root/repository"
          unsigned="$root/latchway-android-$RELEASE_VERSION-maven-repository.zip"
          public_key="$RUNNER_TEMP/latchway-maven-signing-public-key.asc"
          portal="$RUNNER_TEMP/latchway-android-$RELEASE_VERSION-central-portal.zip"
          keyring=$(mktemp -d "$RUNNER_TEMP/latchway-maintainer-signing.XXXXXX")
          trap 'rm -rf -- "$keyring"' EXIT HUP INT TERM
          chmod 700 "$keyring"
          printf '%s' "$LATCHWAY_SIGNING_KEY" | gpg --batch --homedir "$keyring" --import >/dev/null 2>&1
          observed=$(gpg --batch --homedir "$keyring" --with-colons \
            --fingerprint "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')
          test "$observed" = "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT"
          gpg --batch --homedir "$keyring" --armor --export-options export-minimal \
            --export "$LATCHWAY_CENTRAL_SIGNING_FINGERPRINT" > "$public_key"
          test -s "$public_key" && test "$(wc -c < "$public_key")" -le 1048576
          rm -rf -- "$keyring"
          trap - EXIT HUP INT TERM
          LATCHWAY_CENTRAL_EXPECTED_REPOSITORY="$repository" \
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY="$public_key" \
          scripts/build-central-portal-bundle.sh "$RELEASE_VERSION" "$portal"
          unset LATCHWAY_SIGNING_KEY LATCHWAY_SIGNING_PASSWORD
          intent="$RUNNER_TEMP/maven-central-upload-intent.json"
          python3 scripts/central-deployment-record.py create-intent \
            --repository "$repository" --archive "$unsigned" \
            --portal-bundle "$portal" --public-key "$public_key" \
            --source-commit "${{ needs.intent.outputs.commit }}" \
            --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
            --namespace dev.latchway --publishing-type user_managed \
            --output "$intent"
          destination="$RUNNER_TEMP/android-maintainer-signed"
          mkdir -m 700 "$destination"
          cp -R "$repository" "$destination/repository"
          install -m 600 -- \
            "$unsigned" "$portal" "$public_key" "$intent" \
            "$root/SHA256SUMS" \
            "$root/android-dependency-vulnerability-scan.json" \
            "$root/docs-bundle-$RELEASE_VERSION.tar.gz" \
            "$root/latchway-single-maintainer-v1-intent.json" \
            "$root/pinned-core-conformance.tar.gz" \
            "$destination/"
      - name: Bind signed artifact to this workflow attempt
        id: artifact
        run: printf 'name=android-maintainer-signed-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer only signed bytes and public evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/android-maintainer-signed
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  publish-central:
    name: Publish or adopt only exact signed Maven Central 1.0.0 bytes
    needs: [intent, tag, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: single-maintainer-v1-maven
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Verify exact lower-assurance Maven environment
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-android:single-maintainer-v1-maven"
      - name: Check out exact tagged source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch and bind the exact annotated release tag
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "${{ needs.intent.outputs.commit }}"
      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923" # 20.0
          packages: ""
      - name: Install the pinned Android platform and build tools
        run: scripts/install-android-sdk.sh
      - name: Download exact signed candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.artifact_name }}
          path: ${{ runner.temp }}/android-maintainer-signed
      - name: Revalidate tagged source and signed Central inputs
        run: |
          set -euo pipefail
          scripts/release-preflight.sh "$RELEASE_TAG"
          root="$RUNNER_TEMP/android-maintainer-signed"
          rm -rf build/release
          mkdir -p build/release
          cp -R "$root/repository" build/release/repository
          install -m 600 \
            "$root/latchway-android-$RELEASE_VERSION-maven-repository.zip" \
            build/release/
          python3 scripts/central-deployment-record.py validate-inputs \
            --intent "$root/maven-central-upload-intent.json" \
            --repository build/release/repository \
            --archive "build/release/latchway-android-$RELEASE_VERSION-maven-repository.zip" \
            --portal-bundle "$root/latchway-android-$RELEASE_VERSION-central-portal.zip" \
            --public-key "$root/latchway-maven-signing-public-key.asc"
      - name: Stage or adopt and publish exact deterministic Portal deployment
        env:
          LATCHWAY_CENTRAL_DEPLOYMENT_RECORD: ${{ runner.temp }}/maven-central-deployment.json
          LATCHWAY_CENTRAL_DEPLOYMENT_STATUS: ${{ runner.temp }}/maven-central-deployment-status.json
          LATCHWAY_CENTRAL_PORTAL_BUNDLE: ${{ runner.temp }}/android-maintainer-signed/latchway-android-1.0.0-central-portal.zip
          LATCHWAY_CENTRAL_PUBLISH_ATTEMPTS: "90"
          LATCHWAY_CENTRAL_PUBLISH_DELAY_SECONDS: "20"
          LATCHWAY_CENTRAL_PUBLISHING_TYPE: user_managed
          LATCHWAY_CENTRAL_SIGNING_FINGERPRINT: ${{ vars.LATCHWAY_MAVEN_SIGNING_FINGERPRINT }}
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ runner.temp }}/android-maintainer-signed/latchway-maven-signing-public-key.asc
          LATCHWAY_CENTRAL_STOP_AFTER_RECORD: "true"
          LATCHWAY_CENTRAL_UPLOAD_INTENT: ${{ runner.temp }}/android-maintainer-signed/maven-central-upload-intent.json
          LATCHWAY_MAVEN_CENTRAL_PASSWORD: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_PASSWORD }}
          LATCHWAY_MAVEN_CENTRAL_USERNAME: ${{ secrets.LATCHWAY_MAVEN_CENTRAL_USERNAME }}
          LATCHWAY_RELEASE_VERSION: "1.0.0"
        run: |
          set -euo pipefail
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            export LATCHWAY_CENTRAL_INTENT_FRESH=true
          else
            export LATCHWAY_CENTRAL_INTENT_FRESH=false
          fi
          scripts/publish-central.sh
          scripts/publish-validated-central.sh
      - name: Stage exact durable publication state
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/android-maintainer-central-state"
          mkdir -m 700 "$destination"
          install -m 600 -- \
            "$RUNNER_TEMP/maven-central-deployment.json" \
            "$RUNNER_TEMP/maven-central-deployment-status.json" \
            "$destination/"
      - name: Bind publication state artifact to this attempt
        id: artifact
        run: printf 'name=android-maintainer-central-state-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer exact Central state to credential-free verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/android-maintainer-central-state
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  verify-publication:
    name: Verify public Maven bytes and seal lower-assurance release assets
    needs: [intent, tag, sign, publish-central]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: single-maintainer-v1-verification
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Verify exact lower-assurance public-verification environment
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-android:single-maintainer-v1-verification"
      - name: Check out exact verifier source without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.intent.outputs.commit }}
          persist-credentials: false
      - name: Download exact signed inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.sign.outputs.artifact_name }}
          path: ${{ runner.temp }}/android-maintainer-signed
      - name: Download exact Central deployment state
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.publish-central.outputs.artifact_name }}
          path: ${{ runner.temp }}/android-maintainer-central-state
      - name: Verify exact public Maven artifacts, checksums, and signatures
        env:
          LATCHWAY_CENTRAL_DEPLOYMENT_RECORD: ${{ runner.temp }}/android-maintainer-central-state/maven-central-deployment.json
          LATCHWAY_CENTRAL_DEPLOYMENT_STATUS: ${{ runner.temp }}/android-maintainer-central-state/maven-central-deployment-status.json
          LATCHWAY_CENTRAL_EXPECTED_REPOSITORY: ${{ runner.temp }}/android-maintainer-signed/repository
          LATCHWAY_CENTRAL_PORTAL_BUNDLE: ${{ runner.temp }}/android-maintainer-signed/latchway-android-1.0.0-central-portal.zip
          LATCHWAY_CENTRAL_REQUIRE_DEPLOYMENT_EVIDENCE: "true"
          LATCHWAY_CENTRAL_SIGNING_FINGERPRINT: ${{ vars.LATCHWAY_MAVEN_SIGNING_FINGERPRINT }}
          LATCHWAY_CENTRAL_SIGNING_PUBLIC_KEY: ${{ runner.temp }}/android-maintainer-signed/latchway-maven-signing-public-key.asc
          LATCHWAY_CENTRAL_UPLOAD_INTENT: ${{ runner.temp }}/android-maintainer-signed/maven-central-upload-intent.json
        run: >-
          scripts/verify-central-release.sh "$RELEASE_VERSION"
          > "$RUNNER_TEMP/maven-central-release-evidence.json"
      - name: Require exact public signature bytes from the signed Portal candidate
        run: |
          jq --exit-status '
            .signature_files_present == true and
            .signatures_cryptographically_verified == true and
            .signature_files_byte_identical == true and
            (.files | length) == 24 and
            all(.files[];
              .signature_byte_identical == true and
              (.signature_sha256 | test("^[0-9a-f]{64}$")) and
              .expected_signature_sha256 == .signature_sha256)
          ' "$RUNNER_TEMP/maven-central-release-evidence.json" >/dev/null
      - name: Bind exact annotated tag and lower-assurance completion evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          TAG_OBJECT_SHA: ${{ needs.tag.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          message="Latchway Android SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-ref.json"
          test "$(jq --raw-output .object.type "$RUNNER_TEMP/tag-ref.json")" = tag
          test "$(jq --raw-output .object.sha "$RUNNER_TEMP/tag-ref.json")" = "$TAG_OBJECT_SHA"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" > "$RUNNER_TEMP/tag-object.json"
          jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
            "$RUNNER_TEMP/tag-object.json" >/dev/null
          message_sha256=$(printf '%s' "$message" | sha256sum | cut -d ' ' -f 1)
          jq --null-input --arg tag "$RELEASE_TAG" --arg tag_object_sha "$TAG_OBJECT_SHA" \
            --arg commit "$RELEASE_COMMIT" --arg message_sha256 "$message_sha256" \
            '{schema:"latchway.github-release-tag-binding.v1",tag:$tag,tag_object_sha:$tag_object_sha,commit:$commit,message_sha256:$message_sha256}' \
            > "$RUNNER_TEMP/github-release-tag-binding.json"
          maven_evidence_sha256=$(sha256sum "$RUNNER_TEMP/maven-central-release-evidence.json" | cut -d ' ' -f 1)
          core_conformance_sha256=$(sha256sum "$RUNNER_TEMP/android-maintainer-signed/pinned-core-conformance.tar.gz" | cut -d ' ' -f 1)
          jq --null-input --arg commit "$RELEASE_COMMIT" --arg tag "$RELEASE_TAG" \
            --arg intent_sha256 "$INTENT_SHA256" --arg maven_evidence_sha256 "$maven_evidence_sha256" \
            --arg core_conformance_sha256 "$core_conformance_sha256" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              schema_version:1,
              kind:"latchway_single_maintainer_release_evidence",
              profile:"single_maintainer_v1",
              status:"publication_completed_with_deferred_assurance",
              publication_completed:true,
              release_qualified:false,
              fully_evidence_gated:false,
              independently_reviewed:false,
              source:{repository:"Latchway/latchway-android",commit:$commit,tag:$tag,version:"1.0.0"},
              workflow:{file:".github/workflows/single-maintainer-release.yml",run_id:$run_id,run_attempt:$run_attempt},
              maintainer_intent_sha256:$intent_sha256,
              maven_central_release_evidence_sha256:$maven_evidence_sha256,
              pinned_core_conformance_sha256:$core_conformance_sha256,
              published_coordinates:[
                "dev.latchway:latchway-core:1.0.0",
                "dev.latchway:latchway-okhttp:1.0.0",
                "dev.latchway:latchway-play-integrity:1.0.0",
                "dev.latchway:latchway-firebase-auth:1.0.0",
                "dev.latchway:latchway-bom:1.0.0"
              ],
              global_profile_required_evidence:[],
              deferred_evidence:[
                "independent_human_review","live_sdk_conformance","physical_devices",
                "apple_distribution_and_extensions","play_integrity_and_android_device",
                "firebase_app_check","turnstile","live_provider","cloud_deployments",
                "operational_resilience",
                "public_registries.documentation_production_verified","mintlify_production"
              ],
              forbidden_claims:["release_qualified","fully_evidence_gated","independently_reviewed"]
            }' > "$RUNNER_TEMP/single-maintainer-release-evidence.json"
      - name: Seal exact fixed GitHub release asset set
        run: |
          set -euo pipefail
          signed="$RUNNER_TEMP/android-maintainer-signed"
          state="$RUNNER_TEMP/android-maintainer-central-state"
          destination="$RUNNER_TEMP/android-maintainer-release-assets"
          mkdir -m 700 "$destination"
          install -m 600 -- \
            "$signed/latchway-android-$RELEASE_VERSION-maven-repository.zip" \
            "$signed/latchway-android-$RELEASE_VERSION-central-portal.zip" \
            "$signed/docs-bundle-$RELEASE_VERSION.tar.gz" \
            "$signed/android-dependency-vulnerability-scan.json" \
            "$signed/latchway-maven-signing-public-key.asc" \
            "$signed/maven-central-upload-intent.json" \
            "$signed/latchway-single-maintainer-v1-intent.json" \
            "$signed/pinned-core-conformance.tar.gz" \
            "$state/maven-central-deployment.json" \
            "$state/maven-central-deployment-status.json" \
            "$RUNNER_TEMP/maven-central-release-evidence.json" \
            "$RUNNER_TEMP/github-release-tag-binding.json" \
            "$RUNNER_TEMP/single-maintainer-release-evidence.json" \
            "$destination/"
          cd "$destination"
          find . -maxdepth 1 -type f -print | LC_ALL=C sort | sed 's#^./##' > "$RUNNER_TEMP/release-asset-names.txt"
          while IFS= read -r name; do sha256sum "$name"; done < "$RUNNER_TEMP/release-asset-names.txt" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Bind final release artifact to this workflow attempt
        id: artifact
        run: printf 'name=android-maintainer-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer exact release assets to no-secret GitHub publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/android-maintainer-release-assets
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  github-release:
    name: Attest and publish exact GitHub release with deferred-assurance notice
    needs: [intent, tag, verify-publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: single-maintainer-v1-github
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Verify exact lower-assurance GitHub environment
        env:
          OBSERVED_POLICY_ID: ${{ vars.LATCHWAY_RELEASE_CONTROL_POLICY_ID }}
        run: test "$OBSERVED_POLICY_ID" = "latchway-release-controls-v1:latchway-android:single-maintainer-v1-github"
      - name: Download exact fixed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.verify-publication.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Validate exact local asset closure before requesting OIDC
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release"
          test -d "$root" && test ! -L "$root"
          test -z "$(find "$root" -type l -print -quit)"
          test "$(find "$root" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 14
          test "$(find "$root" -mindepth 2 -print -quit)" = ""
          (cd "$root" && sha256sum --check --strict SHA256SUMS)
      - name: Attest every exact release asset with GitHub build provenance
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: ${{ runner.temp }}/release/*
      - name: Create, resume, and verify exact GitHub release without overwriting bytes
        env:
          GH_TOKEN: ${{ github.token }}
          INTENT_SHA256: ${{ needs.intent.outputs.intent_sha256 }}
          RELEASE_COMMIT: ${{ needs.intent.outputs.commit }}
          TAG_OBJECT_SHA: ${{ needs.tag.outputs.tag_object_sha }}
        run: |
          set -euo pipefail
          version=$(gh --version | sed -nE '1s/^gh version ([0-9]+)\.([0-9]+)\.([0-9]+).*$/\1 \2 \3/p')
          read -r major minor patch <<< "$version"
          [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]
          (( major > 2 || (major == 2 && minor >= 97) ))
          title='Latchway Android SDK 1.0.0 — single-maintainer v1'
          notes="$RUNNER_TEMP/release-notes.md"
          body="Published with the \`single_maintainer_v1\` profile.

          The Maven Central bytes, OpenPGP signatures, deterministic source artifacts, pinned-core conformance, and GitHub provenance in this registry-only release were verified by automation. Independent human review, cloud deployments, and external platform/device/provider evidence are deferred. No deployment target is claimed as verified.

          This release is not \`release_qualified\`, fully evidence-gated, or independently reviewed."
          printf '%s' "$body" > "$notes"
          message="Latchway Android SDK v1.0.0

          Release profile: single_maintainer_v1
          Assurance: deferred; not release-qualified or independently reviewed
          Maintainer intent SHA-256: $INTENT_SHA256"
          verify_tag() {
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.type)" = tag
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$TAG_OBJECT_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$TAG_OBJECT_SHA" > "$RUNNER_TEMP/final-tag.json"
            jq --exit-status --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" --arg message "$message" \
              '.tag == $tag and .object.type == "commit" and .object.sha == $commit and .message == $message' \
              "$RUNNER_TEMP/final-tag.json" >/dev/null
          }
          verify_tag
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,body,assets > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$title" --notes-file "$notes"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,body,assets > "$RUNNER_TEMP/release.json"
          jq --exit-status --arg title "$title" --arg body "$body" '
            .tagName == "v1.0.0" and .name == $title and .isPrerelease == false and
            (.isDraft | type) == "boolean" and .body == $body and (.assets | type) == "array" and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length)
          ' "$RUNNER_TEMP/release.json" >/dev/null
          find "$RUNNER_TEMP/release" -maxdepth 1 -type f -print | LC_ALL=C sort | xargs -n1 basename > "$RUNNER_TEMP/local-assets.txt"
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" | LC_ALL=C sort > "$RUNNER_TEMP/remote-assets.txt"
          unexpected=$(comm -13 "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt")
          test -z "$unexpected"
          mkdir "$RUNNER_TEMP/existing-assets"
          while IFS= read -r name; do
            if grep --fixed-strings --line-regexp --quiet "$name" "$RUNNER_TEMP/remote-assets.txt"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$RUNNER_TEMP/existing-assets"
              cmp --silent "$RUNNER_TEMP/release/$name" "$RUNNER_TEMP/existing-assets/$name"
            else
              test "$(jq --raw-output .isDraft "$RUNNER_TEMP/release.json")" = true
              gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/$name" --repo "$GITHUB_REPOSITORY"
            fi
          done < "$RUNNER_TEMP/local-assets.txt"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,body,assets > "$RUNNER_TEMP/release.json"
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/release.json" | LC_ALL=C sort > "$RUNNER_TEMP/remote-assets.txt"
          cmp --silent "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt"
          jq --exit-status --arg title "$title" --arg body "$body" '
            .tagName == "v1.0.0" and .name == $title and .isPrerelease == false and
            (.isDraft | type) == "boolean" and .body == $body
          ' "$RUNNER_TEMP/release.json" >/dev/null
          rm -rf "$RUNNER_TEMP/downloaded-assets"
          mkdir "$RUNNER_TEMP/downloaded-assets"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/downloaded-assets"
          diff -qr "$RUNNER_TEMP/release" "$RUNNER_TEMP/downloaded-assets"
          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/pre-publish-tag-ref.json"
          gh api --include -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/pre-publish-release.http"
          head -n 1 "$RUNNER_TEMP/pre-publish-release.http" | tr -d '\r' \
            | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 200( |$)'
          awk '
            { line=$0; sub(/\r$/, "", line); if (body) print $0; else if (line == "") body=1 }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/pre-publish-release.json"
          awk '
            { line=$0; sub(/\r$/, "", line); if (tolower(line) ~ /^etag:[[:space:]]*/) { sub(/^[^:]+:[[:space:]]*/, "", line); print line } }
          ' "$RUNNER_TEMP/pre-publish-release.http" > "$RUNNER_TEMP/pre-publish-release.etag"
          test "$(wc -l < "$RUNNER_TEMP/pre-publish-release.etag" | tr -d ' ')" = 1
          grep --extended-regexp --quiet '^(W/)?"[^"]+"$' "$RUNNER_TEMP/pre-publish-release.etag"
          jq --exit-status --arg title "$title" --arg body "$body" '
            .tag_name == "v1.0.0" and .name == $title and .body == $body and .prerelease == false and
            ((.draft == true and .immutable == false) or (.draft == false and .immutable == true)) and
            ([.assets[].name] | length) == 14 and ([.assets[].name] | unique | length) == 14
          ' "$RUNNER_TEMP/pre-publish-release.json" >/dev/null
          release_id=$(jq --exit-status --raw-output '.id | select(type == "number" and . > 0)' "$RUNNER_TEMP/pre-publish-release.json")
          if [[ "$(jq --raw-output .draft "$RUNNER_TEMP/pre-publish-release.json")" == true ]]; then
            printf '{"draft":false,"prerelease":false,"make_latest":"true"}\n' > "$RUNNER_TEMP/finalize-release.json"
            gh api --include -H 'X-GitHub-Api-Version: 2026-03-10' \
              -H "If-None-Match: $(cat "$RUNNER_TEMP/pre-publish-release.etag")" \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              > "$RUNNER_TEMP/pre-publish-release-unchanged.http"
            head -n 1 "$RUNNER_TEMP/pre-publish-release-unchanged.http" | tr -d '\r' \
              | grep --extended-regexp --quiet '^HTTP/[0-9.]+ 304( |$)'
            gh api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --input "$RUNNER_TEMP/finalize-release.json" >/dev/null
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/final-release.json"
          jq --exit-status --argjson id "$release_id" --arg title "$title" --arg body "$body" '
            .id == $id and .tag_name == "v1.0.0" and .name == $title and .draft == false and
            .prerelease == false and .immutable == true and .body == $body and
            ([.assets[].name] | length) == 14 and ([.assets[].name] | unique | length) == 14
          ' "$RUNNER_TEMP/final-release.json" >/dev/null
          jq --raw-output '.assets[].name' "$RUNNER_TEMP/final-release.json" | LC_ALL=C sort > "$RUNNER_TEMP/final-assets.txt"
          cmp --silent "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/final-assets.txt"
          rm -rf "$RUNNER_TEMP/downloaded-final"
          mkdir "$RUNNER_TEMP/downloaded-final"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/downloaded-final"
          diff -qr "$RUNNER_TEMP/release" "$RUNNER_TEMP/downloaded-final"
          while IFS= read -r name; do
            gh release verify-asset "$RELEASE_TAG" "$RUNNER_TEMP/release/$name" --repo "$GITHUB_REPOSITORY" --format json \
              > "$RUNNER_TEMP/release-asset-${name}.json"
          done < "$RUNNER_TEMP/local-assets.txt"
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --format json > "$RUNNER_TEMP/release-attestation.json"
          test -s "$RUNNER_TEMP/release-attestation.json"
          verify_tag
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/post-publish-tag-ref.json"
          cmp --silent "$RUNNER_TEMP/pre-publish-tag-ref.json" "$RUNNER_TEMP/post-publish-tag-ref.json"
