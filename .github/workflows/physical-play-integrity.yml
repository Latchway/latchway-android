name: Physical Play Integrity evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full latchway-android commit embedded in the Play candidate
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: physical-play-integrity-production
  cancel-in-progress: false

jobs:
  play-integrity-production:
    name: Production Play Integrity on physical Android hardware
    environment: play-integrity-production
    runs-on: [self-hosted, Linux, latchway-physical-android]
    timeout-minutes: 45
    steps:
      - name: Check out exact Android candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify immutable commit and runner toolchain
        env:
          EXPECTED_COMMIT: ${{ vars.LATCHWAY_SOURCE_COMMIT }}
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_ADB_VERSION: ${{ vars.LATCHWAY_ADB_VERSION }}
          EXPECTED_APKSIGNER_VERSION: ${{ vars.LATCHWAY_APKSIGNER_VERSION }}
        run: |
          test "$REQUESTED_COMMIT" = "$EXPECTED_COMMIT"
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(adb version | head -n 1)" = "$EXPECTED_ADB_VERSION"
          test "$(apksigner --version 2>&1 | head -n 1)" = "$EXPECTED_APKSIGNER_VERSION"
      - name: Collect and validate production physical-device evidence
        env:
          LATCHWAY_EVIDENCE_OUTPUT_DIR: ${{ runner.temp }}/latchway-play-integrity-evidence
          LATCHWAY_ANDROID_DEVICE_SERIAL: ${{ secrets.LATCHWAY_ANDROID_DEVICE_SERIAL }}
          LATCHWAY_PACKAGE_NAME: ${{ vars.LATCHWAY_ANDROID_PACKAGE_NAME }}
          LATCHWAY_APP_VERSION: ${{ vars.LATCHWAY_ANDROID_APP_VERSION }}
          LATCHWAY_VERSION_CODE: ${{ vars.LATCHWAY_ANDROID_VERSION_CODE }}
          LATCHWAY_SIGNING_CERTIFICATE_SHA256: ${{ vars.LATCHWAY_ANDROID_SIGNING_CERTIFICATE_SHA256 }}
          LATCHWAY_INSTALLED_APK_SET_SHA256: ${{ vars.LATCHWAY_ANDROID_INSTALLED_APK_SET_SHA256 }}
          LATCHWAY_PLAY_TRACK: ${{ vars.LATCHWAY_ANDROID_PLAY_TRACK }}
          LATCHWAY_CLOUD_PROJECT_NUMBER: ${{ vars.LATCHWAY_ANDROID_CLOUD_PROJECT_NUMBER }}
          LATCHWAY_SOURCE_COMMIT: ${{ vars.LATCHWAY_SOURCE_COMMIT }}
          LATCHWAY_CORE_COMMIT: ${{ vars.LATCHWAY_CORE_COMMIT }}
          LATCHWAY_SDK_VERSION: ${{ vars.LATCHWAY_ANDROID_SDK_VERSION }}
          LATCHWAY_CONTRACT_VERSION: ${{ vars.LATCHWAY_CONTRACT_VERSION }}
          LATCHWAY_CONTRACT_BUNDLE_SHA256: ${{ vars.LATCHWAY_CONTRACT_BUNDLE_SHA256 }}
          LATCHWAY_GATEWAY_IMAGE_DIGEST: ${{ vars.LATCHWAY_GATEWAY_IMAGE_DIGEST }}
          LATCHWAY_GATEWAY_CONFIGURATION_SHA256: ${{ vars.LATCHWAY_GATEWAY_CONFIGURATION_SHA256 }}
          LATCHWAY_GATEWAY_ORIGIN: ${{ vars.LATCHWAY_GATEWAY_ORIGIN }}
          LATCHWAY_GATEWAY_DEPLOYMENT_KEY_ID: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_KEY_ID }}
          LATCHWAY_GATEWAY_DEPLOYMENT_STATEMENT_SHA256: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_STATEMENT_SHA256 }}
          LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_PATH: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_PATH }}
          LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_SHA256: ${{ vars.LATCHWAY_GATEWAY_DEPLOYMENT_PUBLIC_KEY_SHA256 }}
          LATCHWAY_GATEWAY_MINIMUM_TRUST_LEVEL: ${{ vars.LATCHWAY_GATEWAY_MINIMUM_TRUST_LEVEL }}
          LATCHWAY_ENVIRONMENT: ${{ vars.LATCHWAY_ENVIRONMENT }}
          LATCHWAY_ERROR_MAPPING_FEATURE: ${{ vars.LATCHWAY_ERROR_MAPPING_FEATURE }}
          LATCHWAY_RUN_ID: play-integrity-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/run-physical-play-integrity.sh
      - name: Attest the validated profile and evidence
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            ${{ runner.temp }}/latchway-play-integrity-evidence/play-integrity-profile.json
            ${{ runner.temp }}/latchway-play-integrity-evidence/play-integrity-evidence.json
            ${{ runner.temp }}/latchway-play-integrity-evidence/SHA256SUMS
      - name: Retain the GitHub Sigstore bundle with the report
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "${{ runner.temp }}/latchway-play-integrity-evidence/github-attestation.sigstore.json"
      - name: Retain redacted evidence, JUnit, profiles, and hashes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-integrity-physical-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/latchway-play-integrity-evidence
          if-no-files-found: warn
          retention-days: 30
