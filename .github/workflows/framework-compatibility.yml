name: Scheduled framework compatibility

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-framework-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: ${{ matrix.profile }} framework profile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [minimum, latest, newest-compatible]
    steps:
      - name: Check out the Android SDK
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Resolve the locked core source
        id: core
        shell: bash
        run: |
          set -euo pipefail
          commit=$(awk '$1 == "core_commit:" {print $2}' contract.lock)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the locked canonical registry and case validator
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: Latchway/latchway
          ref: ${{ steps.core.outputs.commit }}
          path: _core
          persist-credentials: false
      - name: Validate the complete Android registry report
        run: >-
          python3 _core/scripts/framework_conformance.py
          --manifest _core/conformance/framework-cases.json
          --registry _core/compatibility/frameworks.yaml
          --report Conformance/framework-report.json
          --require-repository latchway-android
      - name: Configure Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "14742923"
          packages: ""
      - name: Install the pinned Android platform
        run: scripts/install-android-sdk.sh
      - name: Select bounded dependency coordinates
        id: versions
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in
            minimum) okhttp=4.9.2; koog=1.1.1 ;;
            latest) okhttp=5.3.0; koog=1.1.1 ;;
            newest-compatible) okhttp='[5.3.0,6.0.0['; koog=1.1.1 ;;
            *) exit 2 ;;
          esac
          printf 'okhttp=%s\nkoog=%s\n' "$okhttp" "$koog" >> "$GITHUB_OUTPUT"
      - name: Resolve and record the exact selected runtime graph
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :latchway-okhttp:dependencyInsight \
            --dependency com.squareup.okhttp3:okhttp \
            --configuration debugUnitTestRuntimeClasspath \
            -Platchway.okhttp.version='${{ steps.versions.outputs.okhttp }}' \
            -Platchway.koog.version='${{ steps.versions.outputs.koog }}' \
            --no-daemon > "$RUNNER_TEMP/okhttp-dependency.txt"
          ./gradlew :latchway-okhttp:dependencyInsight \
            --dependency ai.koog:prompt-executor-openai-client \
            --configuration debugUnitTestRuntimeClasspath \
            -Platchway.okhttp.version='${{ steps.versions.outputs.okhttp }}' \
            -Platchway.koog.version='${{ steps.versions.outputs.koog }}' \
            --no-daemon > "$RUNNER_TEMP/koog-dependency.txt"
      - name: Run the Android and Koog framework suite
        id: framework-tests
        continue-on-error: true
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            :latchway-okhttp:testDebugUnitTest
            -Platchway.okhttp.version='${{ steps.versions.outputs.okhttp }}'
            -Platchway.koog.version='${{ steps.versions.outputs.koog }}'
            --no-daemon
          )
          if [[ "$PROFILE" == minimum ]]; then
            arguments+=(
              --tests '*AuthenticatorPolicyTest'
              --tests '*LangChain4jFrameworkConformanceTest'
              --tests '*OkHttpLatchwayTransportTest'
              --tests '*OpenAiKotlinFrameworkConformanceTest'
              --tests '*RetrofitFrameworkConformanceTest'
              --tests '*RoutePolicyTest'
            )
          fi
          ./gradlew "${arguments[@]}"
      - name: Emit machine-readable compatibility evidence
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
          OUTCOME: ${{ steps.framework-tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          okhttp=$(sed -nE 's/^com\.squareup\.okhttp3:okhttp:([0-9][^ ]*) .*$/\1/p' "$RUNNER_TEMP/okhttp-dependency.txt" | head -n 1)
          koog=$(sed -nE 's/^ai\.koog:prompt-executor-openai-client:([0-9][^ ]*) .*$/\1/p' "$RUNNER_TEMP/koog-dependency.txt" | head -n 1)
          test -n "$okhttp" && test -n "$koog"
          if [[ "$PROFILE" == minimum ]]; then koog="$koog (resolved; exercised in latest profile)"; fi
          python3 _core/scripts/framework_observation.py \
            --repository latchway-android \
            --profile "$PROFILE" \
            --outcome "$OUTCOME" \
            --report Conformance/framework-report.json \
            --version "OkHttp=$okhttp" \
            --version "Koog=$koog" \
            --output "$RUNNER_TEMP/android-framework-$PROFILE.json"
      - name: Retain the report, resolved graph, tests, and observation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-framework-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-framework-${{ matrix.profile }}.json
            ${{ runner.temp }}/okhttp-dependency.txt
            ${{ runner.temp }}/koog-dependency.txt
            Conformance/framework-report.json
            latchway-okhttp/build/test-results/testDebugUnitTest
          if-no-files-found: error
          retention-days: 30
      - name: Fail after evidence retention
        if: steps.framework-tests.outcome != 'success'
        run: exit 1

  issue-on-failure:
    name: Open one scheduled compatibility issue
    needs: compatibility
    if: always() && github.event_name == 'schedule' && needs.compatibility.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Create or update the deduplicated issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Scheduled Android framework compatibility failed"
        shell: bash
        run: |
          set -euo pipefail
          body="The minimum/latest/newest-compatible framework matrix failed. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" --json number,title --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi
